name: form_app
description: "Chhattisgarh C & F Agency Activity Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  intl: ^0.19.0
  get: ^4.6.6
  uuid: ^4.3.3
  image_picker: ^1.1.2
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  flutter_widget_from_html: ^0.17.1
  printing: ^5.13.1
  url_launcher: ^6.2.5
  http: ^1.1.0
  http_parser: ^4.0.2
  google_mlkit_face_detection: ^0.13.1
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/krishna.png
    - assets/mobilefacenet.tflite

dependency_overrides:
  audio_session: ^0.2.4